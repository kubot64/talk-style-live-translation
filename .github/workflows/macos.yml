name: macOS

on:
  push:
    branches: [main, macos-port]
    tags: ["v*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Apple silicon app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-apple-darwin
          rustup default stable
          rustc --version

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Check
        run: cargo clippy --locked --target aarch64-apple-darwin --bins --lib -- -D warnings

      # The Windows test suite pins Windows archives and file names; these are
      # the tests that cover the macOS code paths.
      - name: Test
        run: >
          cargo test --locked --target aarch64-apple-darwin --lib --
          macos:: platform::tests installer::tests::tar_runtime
          storage:: hardware:: live_text:: glossary:: subtitles::

      - name: Runtime smoke test (downloads the pinned runtimes)
        run: cargo test --locked --target aarch64-apple-darwin --lib -- --ignored macos_runtime_unpacks_and_runs macos_library_unpacks_and_loads

      - name: Package
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF#refs/tags/v}"; fi
          scripts/package-macos.sh "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: talk-style-live-translation-macos-arm64
          path: |
            dist/*.zip
            dist/*.sha256

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          flags=()
          if [[ "$tag" == *-* ]]; then flags+=(--prerelease); fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" "${flags[@]}" \
            --title "Talk風Live翻訳 ${tag#v}（Mac版・Apple silicon）" \
            --notes "Apple silicon搭載Mac（macOS 13以降）向けのビルドです。入れ方とWindows版との違いは docs/MACOS.md を見てください。初回はFinderでアプリを右クリック→「開く」で開きます。"
          gh release upload "$tag" dist/*.zip dist/*.sha256 --clobber

      # Every push to main replaces the "mac-latest" pre-release, so the newest
      # Mac ZIP can always be downloaded without signing in to GitHub.
      - name: Publish the latest build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete mac-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create mac-latest dist/*.zip dist/*.sha256 \
            --target "$GITHUB_SHA" --prerelease \
            --title "Mac版（最新・Apple silicon）" \
            --notes "main の最新（${GITHUB_SHA::7}）から自動で作った、Apple silicon搭載Mac（macOS 13以降）向けのZIPです。初回はFinderでアプリを右クリック→「開く」で開きます。入れ方とWindows版との違いは docs/MACOS.md を見てください。"
